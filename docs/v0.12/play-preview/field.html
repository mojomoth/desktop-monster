body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  user-select: none;
  /* Drag regions swallow mousedown — fallback input needs clicks, so only
     the 24-px top strip below is draggable. */
  -webkit-app-region: no-drag;
}

.drag-handle {
  /* Overlays the top of the canvas (2026-09-06): the 400x260 window holds the
     whole 200x130 canvas at 2x, so the handle must not push it down and clip
     the ground strip + type badges off the bottom. */
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 24px;
  -webkit-app-region: drag;
}

.drag-handle:hover {
  /* Subtle grip hint so the only draggable strip is discoverable. */
  background: rgba(255, 255, 255, 0.08);
  border-radius: 4px;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  -webkit-app-region: no-drag;
}

#field-save-status, #field-save-recovery {
  position: absolute;
  top: 28px;
  left: 8px;
  right: 8px;
  margin: 0;
  padding: 6px;
  color: #fff2dd;
  background: #442637;
  font: 12px/1.5 monospace;
  -webkit-app-region: no-drag;
}
#field-save-recovery { top: 110px; }
#field-save-recovery button { font: inherit; }
[hidden] { display: none !important; }
#field-pvp-status {
  position: absolute; top: 12%; left: 6px; right: 6px; margin: 0;
  color: #deeed6; font: bold 3vw/1.2 monospace; text-align: center;
  text-shadow: -1px 0 #140c1c, 1px 0 #140c1c, 0 -1px #140c1c, 0 1px #140c1c;
  pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#raid-status {
  position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 16px); margin: 0; padding: 3px 7px;
  border: 2px solid #8595a1; border-radius: 0; box-shadow: 2px 2px 0 #140c1c, -2px -2px 0 #140c1c;
  color: #deeed6; background: #140c1c; font: 12px/1.2 ui-monospace, monospace;
  white-space: nowrap; image-rendering: pixelated; pointer-events: none;
  -webkit-app-region: no-drag;
}
#raid-status:disabled { opacity: 1; }
#raid-status.alert { background: #dad45e; color: #140c1c; border-color: #d04648; cursor: pointer; pointer-events: auto; animation: raid-alert 600ms steps(1) infinite; }
#raid-status.done { border-color: #6daa2c; color: #deeed6; background: #346524; }
#raid-status.offline { top: auto; bottom: 2px; color: #dad45e; }
#raid-status:focus-visible { outline: 2px solid #deeed6; outline-offset: 2px; }
@keyframes raid-alert { 50% { border-color: #dad45e; } }
@media (prefers-reduced-motion: reduce) { #raid-status.alert { animation: none; } }
