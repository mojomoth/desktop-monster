<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>DesMon · 레이드 메뉴 프리뷰</title><style>:root {
  color: #deeed6;
  background: #140c1c;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 12px;
  font-synthesis: none;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 12px;
  color: #deeed6;
  background: #140c1c;
  image-rendering: pixelated;
}

button,
input {
  font: inherit;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  border-bottom: 2px solid #8595a1;
}

.tab {
  padding: 7px 10px;
  color: #8595a1;
  background: #442434;
  border: 2px solid #8595a1;
  border-bottom: 0;
  cursor: pointer;
}

.tab.active {
  color: #140c1c;
  background: #6dc2ca;
  border-color: #6dc2ca;
}

.panel {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}

.panel[hidden] {
  display: none;
}

.card {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  min-width: 0;
  gap: 4px 8px;
  align-items: center;
  padding: 8px;
  background: #30346d;
  border: 2px solid #8595a1;
  box-shadow: 2px 2px 0 #442434;
}

canvas.species {
  width: 48px;
  height: 40px;
  grid-row: span 3;
  image-rendering: pixelated;
}

.name {
  min-width: 0;
  overflow-wrap: anywhere;
  color: #deeed6;
  font-weight: 700;
}

.stars {
  color: #dad45e;
  letter-spacing: 1px;
}

.power {
  color: #6dc2ca;
  text-align: right;
}

.companion-stats {
  grid-column: 2 / -1;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 12px;
}

.hunting-power { color: #dad45e; overflow-wrap: anywhere; }

.btn {
  padding: 6px 8px;
  color: #deeed6;
  background: #d04648;
  border: 2px solid #8595a1;
  border-radius: 0;
  box-shadow: 2px 2px 0 #442434;
  cursor: pointer;
}

.btn:active:not(:disabled) {
  translate: 2px 2px;
  box-shadow: none;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  min-width: 0;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 7px;
  border-bottom: 1px solid #8595a1;
}

/* Action buttons belong to the whole card, not an implicit narrow grid cell. */
.card > .row {
  grid-column: 1 / -1;
  justify-content: flex-start;
  border: 0;
  padding: 4px 0 0;
}

.row > *, .card > *, input {
  min-width: 0;
  max-width: 100%;
}

.power, .stars, .result, #preview {
  overflow-wrap: anywhere;
}

.row input {
  flex: 1 1 160px;
}

.footer {
  margin-top: 12px;
  padding-top: 10px;
  text-align: center;
  border-top: 2px solid #8595a1;
}

.result {
  min-height: 2.5em;
  padding: 8px;
  color: #6dc2ca;
  background: #442434;
  border-left: 4px solid #d04648;
}

.type {
  display: inline-grid;
  width: 18px;
  height: 16px;
  place-items: center;
  color: #deeed6;
  border: 2px solid #140c1c;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

.type-fire {
  background: #d04648;
}

.type-wind {
  color: #140c1c;
  background: #6dc2ca;
}

.type-earth {
  background: #854c30;
}

.type-water {
  background: #597dce;
}

.type-dark {
  background: #4e4a4e;
}

.pvp-mark,
.pvp {
  color: #dad45e;
  font-weight: 700;
  white-space: nowrap;
}

.card.mini {
  min-width: 0;
  min-height: 46px;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 2px 4px;
  padding: 4px;
  font-size: 10px;
  box-shadow: none;
}

#party .card.mini, #opponent .party .card.mini, .opponent-card .party .card.mini {
  grid-template-columns: minmax(0, 1fr);
  justify-items: center;
  text-align: center;
}

#party .card.mini canvas.species, #opponent .party .card.mini canvas.species, .opponent-card .party .card.mini canvas.species {
  grid-row: auto;
}

.card.mini canvas.species {
  width: 24px;
  height: 20px;
  grid-row: span 3;
}

#opponent,
#thefts {
  display: grid;
  gap: 6px;
  padding: 6px;
  background: #442434;
  border: 2px solid #8595a1;
}

#opponent .party,
.opponent-card .party,
#party {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
}

.slot {
  min-width: 0;
  min-height: 58px;
  display: grid;
  place-items: center;
  padding: 2px;
  color: #8595a1;
  background: #30346d;
  border: 2px dashed #8595a1;
}

.slot:empty::after {
  content: "EMPTY";
  font-size: 9px;
}

.slot > .card.mini {
  width: 100%;
  height: 100%;
}

.pick {
  appearance: none;
  color: #deeed6;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.pick.selected {
  background: #346524;
  border-color: #dad45e;
  box-shadow: inset 0 0 0 2px #140c1c;
}

#preview {
  min-height: 2em;
  padding: 6px;
  color: #dad45e;
  background: #30346d;
  border-left: 4px solid #6dc2ca;
}

#find,
#auto,
#save-party {
  min-height: 30px;
}

#find {
  color: #140c1c;
  background: #6dc2ca;
}

#auto,
#save-party {
  background: #30346d;
}

#battle-go {
  width: 100%;
}

#battle-go[disabled] {
  color: #8595a1;
  background: #4e4a4e;
  border-color: #757161;
  box-shadow: none;
}

#thefts .row {
  align-items: flex-start;
  padding: 6px;
  background: #30346d;
  border: 2px solid #8595a1;
}

#thefts .row button {
  flex: 0 0 auto;
  padding: 4px 6px;
  color: #140c1c;
  background: #dad45e;
  border: 2px solid #140c1c;
  border-radius: 0;
  font: inherit;
  cursor: pointer;
}

/* Compact choices keep the existing 420-point pixel menu. */
.hero-art { width: 96px; height: 96px; image-rendering: pixelated; object-fit: contain; }
.hero-summary { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 8px; padding: 8px; background: #23243f; border: 2px solid #6dc2ca; }

.hero-summary-meta { color: #a9b0c5; }
.hero-summary-gold { color: #dad45e; }
.hero-summary .power { text-align: left; }
.muted { color: #a9b0c5; font-size: 11px; line-height: 1.6; }
h2 { font-size: 16px; margin: 4px 0 8px; }

.hero-choice { display: grid; grid-template-columns: 48px minmax(0, 1fr) 54px; align-items: center; gap: 8px; padding: 6px; border: 1px solid #8595a1; background: #23243f; overflow-wrap: anywhere; }
.hero-choice-text { min-width: 0; }

.hero-choice h3, .hero-choice p { margin: 0; line-height: 1.4; }
.hero-choice .hero-buff { color: #6dc2ca; }
.hero-choice .btn { padding: 6px 4px; min-height: 36px; font-size: 14px; }
.hero-choice .stars { letter-spacing: 0; font-size: 10px; }
.hero-rules { margin-top: 10px; }
.hero-rules summary, .codex-help summary, #user-settings summary { cursor: pointer; line-height: 1.6; }
.roster-shortcut { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.roster-shortcut .btn { flex-shrink: 0; }

.hero-gallery summary { cursor: pointer; padding: 12px 0; }
.hero-buff { color: #6dc2ca; }
.opponent-card { padding: 10px; border: 1px solid #8595a1; background: #23243f; margin: 8px 0; }
.opponent-card.selected { border-color: #dad45e; background: #30346d; box-shadow: inset 0 0 0 1px #dad45e; }
.opponent-card > .opponent-hero { float: left; width: 64px; height: 64px; margin-right: 8px; }
.opponent-card .hero-art { width: 64px; height: 64px; }
.opponent-card > .name, .opponent-card > .opponent-hero-name, .opponent-card > .record, .opponent-card > .muted { display: block; margin-left: 72px; line-height: 1.6; overflow-wrap: anywhere; }
.opponent-hero-name { color: #6dc2ca; font-size: 11px; }
.opponent-card .party { clear: both; padding: 8px 0; }
.opponent-card .party > .muted { grid-column: 1 / -1; }
.opponent-card > .btn { width: 100%; }
.battle-status { display: block; margin-top: 8px; padding: 8px; border-left: 2px solid #6dc2ca; background: #192635; line-height: 1.6; overflow-wrap: anywhere; scroll-margin-block: 8px; }
.battle-status:empty { display: none; }
#pvp-playback-status { position: sticky; top: 0; z-index: 10; padding: 10px; color: #deeed6; background: #192635; border: 1px solid #6dc2ca; line-height: 1.5; }
.pvp-gold-rules p { line-height: 1.6; }
.opponent-card .record { color: #dad45e; }
button[aria-disabled="true"] { opacity: .55; cursor: wait; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid #dad45e; outline-offset: 3px; }

/* Nine tabs remain on one row in the 560px menu. */
.tabs { flex-wrap: nowrap; }
.tabs .tab { flex: 1 1 0; min-width: 0; min-height: 34px; white-space: nowrap; padding-inline: 6px; }
[hidden] { display: none !important; }
.next-level, .field-phase { color: #dad45e; line-height: 1.6; }
.stack-change { color: #dad45e; font-size: 11px; }
.shop-card, .profile-stats, .profile-history, .hero-totals { padding: 12px; border: 1px solid #8595a1; background: #23243f; }
.shop-card { display: grid; gap: 6px; }
.shop-card p { margin: 4px 0; line-height: 1.6; }

.profile-stats p, .history-entry p { line-height: 1.6; overflow-wrap: anywhere; }

.profile-history > summary, .hero-totals > summary { cursor: pointer; line-height: 1.6; }
.history-entry { padding: 12px 0; border-bottom: 1px solid #4e4a4e; }

.codex-tabs { display: flex; gap: 8px; }
.codex-tabs > .btn { flex: 1; min-height: 36px; background: #30346d; }
.codex-tabs > .selected { color: #140c1c; background: #6dc2ca; }
.codex-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: start; }
.codex-card { min-width: 0; padding: 8px; background: #23243f; border: 1px solid #8595a1; overflow-wrap: anywhere; }

.codex-summary { cursor: pointer; text-align: center; }
.codex-summary > span { display: block; }
.codex-number { color: #a9b0c5; font-size: 10px; }
.codex-summary .stars { margin-top: 4px; letter-spacing: 0; font-size: 10px; }
.codex-art { height: 100px; }
.monster-art { width: 96px; height: 96px; image-rendering: pixelated; }
.codex-card p { line-height: 1.6; margin: 8px 0; }
.codex-stats { color: #6dc2ca; }
.codex-eligibility, .condition { font-size: 11px; }
.codex-eligibility { color: #dad45e; }
.codex-conditions { padding-top: 4px; border-top: 1px solid #4e4a4e; }
.codex-equip { width: 100%; min-height: 34px; }
#name-status { min-height: 1.6em; }
@media (max-width: 340px) { .codex-grid { grid-template-columns: minmax(0, 1fr); } }

/* v0.6 return view: persistent discoveries and one optional goal in the codex. */

.goal-status:empty, .goal-conditions:empty, .result:empty, #welcome-status:empty, #settings-status:empty { display: none; }
.codex-help { margin: 2px 0 6px; }
.discovery-previews { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.discovery-preview { display: flex; align-items: center; gap: 6px; max-width: 100%; font-size: 12px; }
.discovery-preview canvas { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; }
.discovery-name { overflow-wrap: anywhere; }
.goal-status { color: #c9dccf; }
.codex-goal { margin-top: 8px; }
.codex-goal[aria-pressed="true"] { border-color: #9ed395; }

#save-status:not([hidden]) { position: sticky; top: 0; z-index: 10; padding: 12px; border: 1px solid #ffb39c; background: #442c2c; color: #fff0e8; }
#welcome, #save-recovery, #user-settings { padding: 10px; border: 1px solid #8595a1; background: #23243f; margin-bottom: 12px; }
#welcome p, #save-recovery p { line-height: 1.6; overflow-wrap: anywhere; }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#input-status { color: #dad45e; }
#user-settings .btn { margin-top: 8px; }
#settings-status, #welcome-status, #recovery-status { color: #dad45e; line-height: 1.5; }
/* v0.9: metric controls and recoverable progress actions fit the pixel menu. */
.rank-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.rank-tools [aria-pressed="true"] { background: #5fcde4; color: #140c1c; }
.checkpoint-row { border-top: 1px solid #847e87; padding: 8px 0; }
#progress-recovery { margin-top: 16px; }
#progress-recovery summary, #party-editor summary { cursor: pointer; padding: 8px 0; }
#share-open { margin-left: auto; }

/* Equipment rarity tokens color the complete card and its name together. */
.equipment-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
.equipment-card { border:2px solid var(--rarity-color); border-radius:8px; padding:12px; background:#14212b; min-width:0; }
.equipment-name { color:var(--rarity-color); font-size:14px; line-height:1.5; margin:6px 0; }
.equipment-card p { overflow-wrap:anywhere; }
.equipment-icon { image-rendering:pixelated; float:left; margin:0 8px 8px 0; }
.equipment-details { clear:both; }
.equipment-danger { color:#ffad99; }
.equipment-section { margin:20px 0; }
.equipment-pages { display:flex; align-items:center; gap:12px; margin-top:12px; }
.equipment-card .btn { margin:6px 6px 0 0; }
.equipment-cost { max-height:100px; overflow:auto; font-variant-numeric:tabular-nums; }
.equipment-countdown { font-variant-numeric:tabular-nums; color:#d6bc82; }

.codex-summary { position: relative; list-style: none; padding-bottom: 16px; }
.codex-summary::-webkit-details-marker { display: none; }
.codex-summary::after { content: '▸'; position: absolute; right: 0; bottom: 0; color: #dad45e; }
.codex-card[open] > .codex-summary::after { transform: rotate(90deg); }
.menu-feedback:has(.result:empty):has(#cancel-selection[hidden]) { display: none; }
.menu-feedback { margin-bottom: 8px; }
.result[data-state="pending"] { color: #dad45e; }
.hero-utility { margin-top: 16px; padding-top: 12px; border-top: 1px solid #42546a; }
.equipment-equip-choice > summary { cursor: pointer; }
.equipment-equip-options { display: grid; gap: 6px; }

/* Raid cards and game confirmations share the existing menu palette. */
.raid-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.raid-heading h2 { margin: 0; }
.raid-heading .muted { font-size: 10px; }
.raid-list { display: grid; gap: 6px; }
.raid-card { grid-template-columns: 128px minmax(0, 1fr); gap: 6px; padding: 2px 4px; }
.raid-current { padding: 6px 4px; border-color: #6dc2ca; }
.raid-current.locked { border-color: #8595a1; }
.raid-art { display: block; image-rendering: pixelated; }
.raid-card-content { display: grid; min-width: 0; gap: 4px; }
.raid-title { display: flex; gap: 6px; min-width: 0; align-items: center; }
.raid-title h3 { margin: 0; font-size: 12px; }
.raid-phase { margin-left: auto; color: #a9b0c5; font-size: 10px; white-space: nowrap; }
.raid-conditions { display: flex; flex-wrap: wrap; gap: 2px 10px; }

.raid-status-line { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
.raid-countdown { color: #dad45e; font-size: 11px; line-height: 18px; white-space: nowrap; }
.raid-capacity { color: #6dc2ca; font-size: 10px; white-space: nowrap; }
.raid-note { margin: 0; font-size: 10px; line-height: 15px; }
.raid-actions { display: flex; align-items: center; gap: 10px; }
.raid-action { min-width: 92px; padding: 5px 8px; font-size: 11px; white-space: nowrap; }
.raid-inline-feedback { color: #6dc2ca; font-size: 10px; line-height: 15px; }
.raid-action:disabled { opacity: 1; color: #a9b0c5; background: #442434; border-color: #4e4a4e; }
.raid-next { background: #23243f; border-color: #4e4a4e; }
.raid-next .muted { margin: 0; font-size: 10px; }
.raid-next .name { color: #a9b0c5; }
.raid-current.confirming { border-color: #dad45e; }
.raid-current.battle { border-color: #d04648; }
.popup { width: 408px; max-width: calc(100vw - 48px); padding: 20px; color: #deeed6; background: #140c1c; border: 2px solid #dad45e; border-radius: 0; box-shadow: 0 -4px 0 -2px #dad45e, 0 4px 0 -2px #dad45e, -4px 0 0 -2px #dad45e, 4px 0 0 -2px #dad45e, 8px 8px 0 #442637; }
.popup::backdrop { background: rgb(20 12 28 / 78%); }
.popup-title { margin: 0 0 10px; color: #dad45e; font-size: 17px; line-height: 24px; letter-spacing: 2px; text-align: center; }
.popup-boss { margin: 0; font-weight: bold; text-align: center; }
.popup-art { display: flex; justify-content: center; margin: 10px 0; padding: 4px; background: #23243f; border-top: 2px solid #442637; border-bottom: 2px solid #442637; }

.popup-copy .popup-loot { color: #dad45e; }
.popup-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.popup-actions .btn { min-width: 94px; }
.popup-actions .popup-primary { color: #140c1c; background: #dad45e; border-color: #deeed6; font-weight: bold; }
.popup button:focus-visible { outline: 2px solid #deeed6; outline-offset: 3px; }

.popup { max-height: calc(100vh - 48px); overflow-y: auto; }
.raid-connection { margin: 0; color: #dad45e; }
.raid-card-content, .popup-copy { overflow-wrap: anywhere; }
