<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>DesMon — 영웅과 모험 기록</title>
    <style>:root {
  color: #deeed6;
  background: #140c1c;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 12px;
  font-synthesis: none;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 12px;
  color: #deeed6;
  background: #140c1c;
  image-rendering: pixelated;
}

button,
input {
  font: inherit;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  border-bottom: 2px solid #8595a1;
}

.tab {
  padding: 7px 10px;
  color: #8595a1;
  background: #442434;
  border: 2px solid #8595a1;
  border-bottom: 0;
  cursor: pointer;
}

.tab.active {
  color: #140c1c;
  background: #6dc2ca;
  border-color: #6dc2ca;
}

.panel {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}

.panel[hidden] {
  display: none;
}

.card {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  min-width: 0;
  gap: 4px 8px;
  align-items: center;
  padding: 8px;
  background: #30346d;
  border: 2px solid #8595a1;
  box-shadow: 2px 2px 0 #442434;
}

canvas.species {
  width: 48px;
  height: 40px;
  grid-row: span 3;
  image-rendering: pixelated;
}

.name {
  min-width: 0;
  overflow-wrap: anywhere;
  color: #deeed6;
  font-weight: 700;
}

.stars {
  color: #dad45e;
  letter-spacing: 1px;
}

.power {
  color: #6dc2ca;
  text-align: right;
}

.btn {
  padding: 6px 8px;
  color: #deeed6;
  background: #d04648;
  border: 2px solid #8595a1;
  border-radius: 0;
  box-shadow: 2px 2px 0 #442434;
  cursor: pointer;
}

.btn:active:not(:disabled) {
  translate: 2px 2px;
  box-shadow: none;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  min-width: 0;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 7px;
  border-bottom: 1px solid #8595a1;
}

/* Action buttons belong to the whole card, not an implicit narrow grid cell. */
.card > .row {
  grid-column: 1 / -1;
  justify-content: flex-start;
  border: 0;
  padding: 4px 0 0;
}

.row > *, .card > *, input {
  min-width: 0;
  max-width: 100%;
}

.power, .stars, .result, #preview {
  overflow-wrap: anywhere;
}

.row input {
  flex: 1 1 160px;
}

.footer {
  margin-top: 12px;
  padding-top: 10px;
  text-align: center;
  border-top: 2px solid #8595a1;
}

.result {
  min-height: 2.5em;
  padding: 8px;
  color: #6dc2ca;
  background: #442434;
  border-left: 4px solid #d04648;
}

.type {
  display: inline-grid;
  width: 18px;
  height: 16px;
  place-items: center;
  color: #deeed6;
  border: 2px solid #140c1c;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

.type-fire {
  background: #d04648;
}

.type-wind {
  color: #140c1c;
  background: #6dc2ca;
}

.type-earth {
  background: #854c30;
}

.type-water {
  background: #597dce;
}

.type-dark {
  background: #4e4a4e;
}

.pvp-mark,
.pvp {
  color: #dad45e;
  font-weight: 700;
  white-space: nowrap;
}

.card.mini {
  min-width: 0;
  min-height: 46px;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 2px 4px;
  padding: 4px;
  font-size: 10px;
  box-shadow: none;
}

#party .card.mini, #opponent .party .card.mini {
  grid-template-columns: minmax(0, 1fr);
  justify-items: center;
  text-align: center;
}

#party .card.mini canvas.species, #opponent .party .card.mini canvas.species {
  grid-row: auto;
}

.card.mini canvas.species {
  width: 24px;
  height: 20px;
  grid-row: span 3;
}

#opponent,
#thefts {
  display: grid;
  gap: 6px;
  padding: 6px;
  background: #442434;
  border: 2px solid #8595a1;
}

#opponent .party,
#party {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
}

.slot {
  min-width: 0;
  min-height: 58px;
  display: grid;
  place-items: center;
  padding: 2px;
  color: #8595a1;
  background: #30346d;
  border: 2px dashed #8595a1;
}

.slot:empty::after {
  content: "EMPTY";
  font-size: 9px;
}

.slot > .card.mini {
  width: 100%;
  height: 100%;
}

.pick {
  appearance: none;
  color: #deeed6;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.pick.selected {
  background: #346524;
  border-color: #dad45e;
  box-shadow: inset 0 0 0 2px #140c1c;
}

#preview {
  min-height: 2em;
  padding: 6px;
  color: #dad45e;
  background: #30346d;
  border-left: 4px solid #6dc2ca;
}

#find,
#auto,
#save-party {
  min-height: 30px;
}

#find {
  color: #140c1c;
  background: #6dc2ca;
}

#auto,
#save-party {
  background: #30346d;
}

#battle-go {
  width: 100%;
}

#battle-go[disabled] {
  color: #8595a1;
  background: #4e4a4e;
  border-color: #757161;
  box-shadow: none;
}

#thefts .row {
  align-items: flex-start;
  padding: 6px;
  background: #30346d;
  border: 2px solid #8595a1;
}

#thefts .row button {
  flex: 0 0 auto;
  padding: 4px 6px;
  color: #140c1c;
  background: #dad45e;
  border: 2px solid #140c1c;
  border-radius: 0;
  font: inherit;
  cursor: pointer;
}

/* v0.4: readable choices in the existing 420-point collection window. */
.hero-art { width: 96px; height: 96px; image-rendering: pixelated; object-fit: contain; }
.hero-summary { padding: 12px; background: #23243f; border: 2px solid #6dc2ca; }
.hero-summary > .hero-art { float: left; margin-right: 12px; }
.hero-summary::after { content: ''; display: block; clear: both; }
.hero-summary .power { text-align: left; }
.muted { color: #a9b0c5; font-size: 11px; line-height: 1.6; }
h2 { font-size: 16px; margin: 4px 0 8px; }
h3 { font-size: 12px; margin: 4px 0; }
.hero-opportunity { padding: 12px; border: 1px solid #8595a1; }
.hero-opportunity > .btn { display: block; width: 100%; margin-top: 8px; }
.hero-choices, .hero-collection { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 12px 0; }
.hero-choice { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border: 1px solid #8595a1; background: #23243f; text-align: center; overflow-wrap: anywhere; }
.hero-choice .hero-art { width: 96px; height: 96px; }
.hero-choice .hero-buff { min-height: 36px; color: #6dc2ca; line-height: 1.5; }
.hero-choice .btn { margin-top: auto; font-size: 11px; }
.hero-choice .stars { letter-spacing: 0; font-size: 10px; }
.hero-choice.locked .hero-art { opacity: .55; }
.hero-gallery summary { cursor: pointer; padding: 12px 0; }
.hero-buff { color: #6dc2ca; }
.opponent-card { padding: 10px; border: 1px solid #8595a1; background: #23243f; margin: 8px 0; }
.opponent-card > .hero-art { float: left; width: 64px; height: 64px; margin-right: 8px; }
.opponent-card > .name, .opponent-card > .record, .opponent-card > .muted { display: block; margin-left: 72px; line-height: 1.6; }
.opponent-card .party { clear: both; }
.opponent-card .record { color: #dad45e; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid #dad45e; outline-offset: 3px; }
@media (max-width: 360px) { .hero-choices, .hero-collection { grid-template-columns: 1fr; } }

/* v0.5: seven short tabs wrap inside the original collection window. */
.tabs { flex-wrap: wrap; }
.tabs .tab { flex: 1 0 auto; min-height: 34px; }
[hidden] { display: none !important; }
.next-level, .field-phase { color: #dad45e; line-height: 1.6; }
.stack-change { color: #dad45e; font-size: 11px; }
.shop-card, .profile-stats, .profile-history, .hero-totals { padding: 12px; border: 1px solid #8595a1; background: #23243f; }
.shop-card { display: grid; gap: 6px; }
.shop-card p { margin: 4px 0; line-height: 1.6; }
.shop-card > .btn { min-height: 36px; }
.shop-effect { color: #6dc2ca; }
.profile-stats p, .history-entry p { line-height: 1.6; overflow-wrap: anywhere; }
.profile-history { margin-top: 12px; }
.profile-history > summary, .hero-totals > summary { cursor: pointer; line-height: 1.6; }
.history-entry { padding: 12px 0; border-bottom: 1px solid #4e4a4e; }
.history-entry:last-child { border-bottom: 0; }
.codex-tabs { display: flex; gap: 8px; }
.codex-tabs > .btn { flex: 1; min-height: 36px; background: #30346d; }
.codex-tabs > .selected { color: #140c1c; background: #6dc2ca; }
.codex-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: start; }
.codex-card { min-width: 0; padding: 8px; background: #23243f; border: 1px solid #8595a1; overflow-wrap: anywhere; }
.codex-card.discovered { border-color: #6dc2ca; }
.codex-summary { cursor: pointer; text-align: center; }
.codex-summary > span { display: block; }
.codex-number { color: #a9b0c5; font-size: 10px; }
.codex-summary .stars { margin-top: 4px; letter-spacing: 0; font-size: 10px; }
.codex-art { height: 100px; }
.monster-art { width: 96px; height: 96px; image-rendering: pixelated; }
.codex-card p { line-height: 1.6; margin: 8px 0; }
.codex-stats { color: #6dc2ca; }
.codex-eligibility, .condition { font-size: 11px; }
.codex-eligibility { color: #dad45e; }
.codex-conditions { padding-top: 4px; border-top: 1px solid #4e4a4e; }
.codex-equip { width: 100%; min-height: 34px; }
#name-status { min-height: 1.6em; }
@media (max-width: 340px) { .codex-grid { grid-template-columns: minmax(0, 1fr); } }
</style>

  <body><aside style="padding:12px;margin-bottom:12px;border:1px dashed #8595a1">v0.5 검토용 · 합성 세이브 / 메모리에서만 동작 · 서버 연결 없음<br><button id="fixture-fresh">새 게임</button> <button id="fixture-offer">환생 후보</button> <button id="fixture-discovered">발견·기록 예시</button> <button id="fixture-tick">플레이 5초 진행</button></aside>
    <div class="tabs" role="tablist" aria-label="게임 메뉴">
      <button class="tab active" id="tab-hero" type="button">영웅</button>
      <button class="tab" id="tab-shop" type="button">상점</button>
      <button class="tab" id="tab-codex" type="button">도감</button>
      <button class="tab" id="tab-profile" type="button">내 기록</button>
      <button class="tab" id="tab-roster" type="button">동료</button>
      <button class="tab" id="tab-ranking" type="button">순위</button>
      <button class="tab" id="tab-battle" type="button">대전</button>
    </div>
    <div class="panel" id="hero"></div>
    <div class="panel" id="shop" hidden></div>
    <div class="panel" id="codex" hidden></div>
    <div class="panel" id="profile" hidden>
      <h2>내 기록</h2>
      <div class="row">
        <label class="name" for="name">플레이어 이름</label>
        <input id="name" type="text" maxlength="16" autocomplete="off" spellcheck="false" aria-describedby="name-rule name-status" />
        <button class="btn" id="save-name" type="button">이름 저장</button>
      </div>
      <p class="muted" id="name-rule">영문·숫자·_·- 1–16자. 오프라인에서도 변경할 수 있습니다.</p>
      <p class="muted" id="name-status" role="status" aria-live="polite"></p>
      <div id="profile-stats"></div>
    </div>
    <div class="panel" id="roster" hidden></div>
    <div class="panel" id="ranking" hidden></div>
    <div class="panel" id="battle" hidden>
      <h2>대전 상대</h2>
      <p class="muted">영웅과 배치된 동료, 전적을 보고 상대를 선택하세요.</p>
      <button class="btn" id="find" type="button">목록 새로고침</button>
      <div id="opponents" aria-live="polite"></div>
      <div id="opponent"><span class="name">No opponent yet</span></div>
      <div id="party">
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
        <div class="slot"></div>
      </div>
      <div class="panel" id="picks"></div>
      <div class="row">
        <button class="btn" id="auto" type="button">Auto</button>
        <button class="btn" id="save-party" type="button">Save party</button>
      </div>
      <p id="preview">Σ vs opponent: 0</p>
      <button class="btn" id="battle-go" type="button">Battle!</button>
      <div id="thefts"></div>
    </div>
    <div class="footer">
      <button class="btn" id="rebirth" type="button" disabled>영혼 회귀 · 외형 유지</button>
    </div>
    <!-- #result is shared: the roster tab writes its consume prompt here too, so
         it stays outside the panels instead of moving into the Battle tab. -->
    <p class="result" id="result"></p>
